[package]
name = "zkap-zkp-node"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
zkap-service = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
ark-ff = "0.5"
ark-bn254 = "0.5"
ark-groth16 = "0.5"
ark-serialize = "0.5"

[build-dependencies]
napi-build = "2"

[features]
default = ["proof"]
proof = ["zkap-service/proof"]
