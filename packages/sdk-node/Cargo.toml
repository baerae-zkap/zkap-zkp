[package]
name = "zkap-zkp-node"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `native-prove` is required for the `zkap_service::{prove_bundles, verify}`
# façade entry points (and the re-exported `Proof` / `F` / `BN254`). It
# pulls in artifact-loader + native-witness, so the separate
# `host-primitives` / `manifest` / `artifact-loader` flags are subsumed.
# `setup` (trusted-setup / key generation) is intentionally NOT enabled:
# the SDK loads pre-generated release bundles and never runs setup, and
# zkap-service now gates `groth16::setup` behind the `setup` feature so
# `native-prove` alone compiles.
zkap-service = { workspace = true, features = ["native-prove"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
libc = "0.2"

# Phase 4 — wasm-runtime + circuit-agnostic prove deps.
#
# wasmtime hosts the required release `witness_gen.wasm` artifact loaded
# from the manifest. Native Groth16 proving is now routed through
# `zkap_service::prove_bundles` (rayon-parallel inside the façade); this
# crate no longer depends on `ark-ar1cs` or runs its own prove loop.
# The remaining ark-* deps (pinned at 0.6 to match zkap-service and the
# WitnessBundle CanonicalSerialize wire format) are only used to
# deserialize the wasm witness bundles and to recompose the Solidity-shaped
# proof strings into `Proof<Bn254>` for `zkap_service::verify`.
wasmtime = { version = "26.0", default-features = false, features = ["cranelift", "runtime"] }
zkap-zkp-prover = { path = "../../crates/prover" }
ark-ff = "0.6"
ark-bn254 = "0.6"
ark-groth16 = "0.6"
ark-serialize = "0.6"

[build-dependencies]
napi-build = "2"

[features]
# Phase 4 PoC — the new zkap-service ar1cs migration removed the
# `proof` feature gate (heavy ark-* deps are now unconditional).
# Keep the feature name as a no-op alias so external callers that
# still pass `--features proof` keep working.
default = ["proof"]
proof = []
