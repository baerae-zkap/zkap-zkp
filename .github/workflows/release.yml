name: Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. v0.2.0). Auto-extracted from tag pushes.
        type: string
        required: false
      skip_tests:
        description: Skip tests before publish
        type: boolean
        default: false
      dry_run_only:
        description: Run publish dry-runs only
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-node:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: index.darwin-x64.node
            artifact_name: binary-x86_64-apple-darwin
            zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: index.darwin-arm64.node
            artifact_name: binary-aarch64-apple-darwin
            zigbuild: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: index.linux-x64-gnu.node
            artifact_name: binary-x86_64-unknown-linux-gnu
            zigbuild: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_name: index.linux-x64-musl.node
            artifact_name: binary-x86_64-unknown-linux-musl
            zigbuild: true

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@c3664f981c04ab538bd76b0ba83680ee5bab631a

      - name: Setup Node.js
        if: ${{ !matrix.zigbuild }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install @napi-rs/cli
        if: ${{ !matrix.zigbuild }}
        run: npm install -g @napi-rs/cli

      - name: Build standard target
        if: ${{ !matrix.zigbuild }}
        working-directory: packages/sdk-node
        run: napi build --platform --release --target ${{ matrix.target }}

      - name: Normalize artifact filename
        if: ${{ !matrix.zigbuild }}
        working-directory: packages/sdk-node
        shell: bash
        run: |
          if [ -f "${{ matrix.binary_name }}" ]; then
            exit 0
          fi
          FOUND="$(find . -maxdepth 1 -name '*.node' | head -n 1)"
          if [ -z "$FOUND" ]; then
            echo "::error::No .node artifact was produced"
            exit 1
          fi
          mv "$FOUND" "${{ matrix.binary_name }}"

      - name: Build musl target
        if: ${{ matrix.zigbuild }}
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185
        with:
          image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          options: -v ${{ github.workspace }}:/build -w /build
          run: |
            apk add --no-cache gcc g++ musl-dev linux-headers cmake
            rustup update stable
            unset CC_x86_64_unknown_linux_musl
            unset CXX_x86_64_unknown_linux_musl
            cargo build --release --target x86_64-unknown-linux-musl -p zkap-zkp-node
            cp target/x86_64-unknown-linux-musl/release/libzkap_zkp_node.so \
              packages/sdk-node/index.linux-x64-musl.node

      - name: Verify musl artifact
        if: ${{ matrix.zigbuild }}
        working-directory: packages/sdk-node
        shell: bash
        run: test -f "${{ matrix.binary_name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/sdk-node/${{ matrix.binary_name }}
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 2. Build React Native binaries
  # ──────────────────────────────────────────────
  build-ios:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            name: ios-arm64
            binary: libzkap_uniffi_bindings.a
            artifact: rn-ios-arm64
          - target: aarch64-apple-ios-sim
            name: ios-sim-arm64
            binary: libzkap_uniffi_bindings.a
            artifact: rn-ios-sim-arm64
          - target: x86_64-apple-ios
            name: ios-sim-x86_64
            binary: libzkap_uniffi_bindings.a
            artifact: rn-ios-sim-x86_64
    runs-on: macos-latest
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p zkap-uniffi-bindings
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  build-android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            name: android-arm64
            abi: arm64-v8a
            artifact: rn-android-arm64
          - target: armv7-linux-androideabi
            name: android-armv7
            abi: armeabi-v7a
            artifact: rn-android-armv7
          - target: x86_64-linux-android
            name: android-x86_64
            abi: x86_64
            artifact: rn-android-x86_64
    runs-on: ubuntu-latest
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Setup Android NDK
        uses: android-actions/setup-android@00854ea68c109d98c75d956347303bf7c45b0277  # v3
        with:
          cmdline-tools-version: "11076708"
      - name: Configure NDK cross-compilation
        run: |
          NDK_HOME=$ANDROID_SDK_ROOT/ndk/$(ls $ANDROID_SDK_ROOT/ndk | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
              ;;
            armv7-linux-androideabi)
              echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
              ;;
            x86_64-linux-android)
              echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" >> $GITHUB_ENV
              ;;
          esac
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p zkap-uniffi-bindings
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/libzkap_uniffi_bindings.so
          if-no-files-found: error

  assemble-ios-xcframework:
    needs: [build-ios]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Download arm64 device artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-ios-arm64
          path: rn-ios-arm64
      - name: Download arm64 simulator artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-ios-sim-arm64
          path: rn-ios-sim-arm64
      - name: Download x86_64 simulator artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-ios-sim-x86_64
          path: rn-ios-sim-x86_64
      - name: Create fat simulator library
        run: |
          lipo -create \
            rn-ios-sim-arm64/libzkap_uniffi_bindings.a \
            rn-ios-sim-x86_64/libzkap_uniffi_bindings.a \
            -output libzkap_uniffi_bindings_sim.a
      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library rn-ios-arm64/libzkap_uniffi_bindings.a \
            -headers packages/sdk-react-native/ios/include \
            -library libzkap_uniffi_bindings_sim.a \
            -headers packages/sdk-react-native/ios/include \
            -output ZkapZkp.xcframework
      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rn-ios-xcframework
          path: ZkapZkp.xcframework
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 3. Publish (dry-run then actual)
  # ──────────────────────────────────────────────
  publish:
    needs: [build-node, assemble-ios-xcframework, build-android]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected x.y.z)"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Validate release package metadata
        run: npm run check:release-packages -- "${{ steps.version.outputs.value }}"

      - name: Verify versions are newer than npm latest
        run: npm run check:npm-latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Download darwin-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-apple-darwin
          path: platform-packages/node-darwin-x64

      - name: Download darwin-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-aarch64-apple-darwin
          path: platform-packages/node-darwin-arm64

      - name: Download linux-x64-gnu binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: platform-packages/node-linux-x64-gnu

      - name: Download linux-x64-musl binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-musl
          path: platform-packages/node-linux-x64-musl

      - name: Copy Linux binaries into sdk-node for validation and packing
        run: |
          cp platform-packages/node-linux-x64-gnu/*.node packages/sdk-node/
          cp platform-packages/node-linux-x64-musl/*.node packages/sdk-node/

      - name: Run Rust tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: cargo test --workspace

      - name: Run sdk-node tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: npm --workspace packages/sdk-node test

      - name: Build sdk
        run: npm --workspace packages/sdk run build

      - name: Build sdk-wasm
        run: npm --workspace packages/sdk-wasm run build

      - name: Run sdk tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: npm --workspace packages/sdk test

      # Download React Native native binaries built by build-react-native.yml
      - name: Download iOS XCFramework
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-ios-xcframework
          path: packages/sdk-react-native/ios/ZkapZkp.xcframework

      - name: Download Android arm64 .so
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-android-arm64
          path: packages/sdk-react-native/android/libs/arm64-v8a

      - name: Download Android armv7 .so
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-android-armv7
          path: packages/sdk-react-native/android/libs/armeabi-v7a

      - name: Download Android x86_64 .so
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-android-x86_64
          path: packages/sdk-react-native/android/libs/x86_64

      - name: Verify React Native package binaries
        run: |
          test -d packages/sdk-react-native/ios/ZkapZkp.xcframework || (echo "Missing iOS XCFramework" && exit 1)
          test -f packages/sdk-react-native/android/libs/arm64-v8a/libzkap_uniffi_bindings.so || (echo "Missing Android arm64 .so" && exit 1)
          test -f packages/sdk-react-native/android/libs/armeabi-v7a/libzkap_uniffi_bindings.so || (echo "Missing Android armv7 .so" && exit 1)
          test -f packages/sdk-react-native/android/libs/x86_64/libzkap_uniffi_bindings.so || (echo "Missing Android x86_64 .so" && exit 1)
          echo "All React Native binaries verified"

      - name: Publish dry-run for all packages
        run: |
          npm publish ./platform-packages/node-darwin-x64 --dry-run --access public
          npm publish ./platform-packages/node-darwin-arm64 --dry-run --access public
          npm publish ./platform-packages/node-linux-x64-gnu --dry-run --access public
          npm publish ./platform-packages/node-linux-x64-musl --dry-run --access public
          npm publish ./packages/sdk-node --dry-run --access public
          npm publish ./packages/sdk-wasm --dry-run --access public
          npm publish ./packages/sdk-react-native --dry-run --access public
          npm publish ./packages/sdk --dry-run --access public

      - name: Publish to npm
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run_only }}
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          npm publish ./platform-packages/node-darwin-x64 --access public --tag latest --provenance
          npm publish ./platform-packages/node-darwin-arm64 --access public --tag latest --provenance
          npm publish ./platform-packages/node-linux-x64-gnu --access public --tag latest --provenance
          npm publish ./platform-packages/node-linux-x64-musl --access public --tag latest --provenance
          npm publish ./packages/sdk-node --access public --tag latest --provenance
          npm publish ./packages/sdk-wasm --access public --tag latest --provenance
          npm publish ./packages/sdk-react-native --access public --tag latest --provenance
          npm publish ./packages/sdk --access public --tag latest --provenance
