name: Build React Native

# Tag pushes intentionally do NOT trigger this workflow: release.yml builds
# its own iOS/Android slices and never consumes these artifacts. Path filters
# skip the matrix for changes that cannot affect the native module.
on:
  push:
    branches: [develop]
    paths:
      - 'crates/**'
      - 'packages/sdk-react-native/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check-rn-ios-runtime.mjs'
      - '.github/workflows/build-react-native.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/sdk-react-native/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check-rn-ios-runtime.mjs'
      - '.github/workflows/build-react-native.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # iOS builds (3 targets, macOS runner required)
  # ──────────────────────────────────────────────
  build-ios:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            name: ios-arm64
            binary: libzkap_uniffi_bindings.a
            artifact: rn-ios-arm64

          - target: aarch64-apple-ios-sim
            name: ios-sim-arm64
            binary: libzkap_uniffi_bindings.a
            artifact: rn-ios-sim-arm64

          - target: x86_64-apple-ios
            name: ios-sim-x86_64
            binary: libzkap_uniffi_bindings.a
            artifact: rn-ios-sim-x86_64

    runs-on: macos-latest
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Verify iOS wasm runtime
        run: npm run check:rn-ios-runtime -- ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release \
            --target ${{ matrix.target }} \
            -p zkap-uniffi-bindings

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Android builds (3 targets, ubuntu runner)
  # ──────────────────────────────────────────────
  build-android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            name: android-arm64
            abi: arm64-v8a
            artifact: rn-android-arm64

          - target: x86_64-linux-android
            name: android-x86_64
            abi: x86_64
            artifact: rn-android-x86_64

    runs-on: ubuntu-latest
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: android-actions/setup-android@00854ea68c109d98c75d956347303bf7c45b0277  # v3
        with:
          cmdline-tools-version: "11076708"

      - name: Configure NDK cross-compilation
        run: |
          NDK_HOME=$ANDROID_SDK_ROOT/ndk/$(ls $ANDROID_SDK_ROOT/ndk | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin

          # Set linker, C compiler, and archiver for each ABI
          # CC_* and AR_* are required by cc-rs to compile C dependencies (e.g. mimalloc)
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android21-clang" >> $GITHUB_ENV
              echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android21-clang" >> $GITHUB_ENV
              echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
              ;;
            x86_64-linux-android)
              echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android21-clang" >> $GITHUB_ENV
              echo "CC_x86_64_linux_android=$TOOLCHAIN/x86_64-linux-android21-clang" >> $GITHUB_ENV
              echo "AR_x86_64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
              ;;
          esac

      - name: Build
        run: |
          cargo build --release \
            --target ${{ matrix.target }} \
            -p zkap-uniffi-bindings

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/libzkap_uniffi_bindings.so
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Assemble iOS XCFramework from 3 slice artifacts
  # ──────────────────────────────────────────────
  assemble-ios-xcframework:
    needs: [build-ios]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download arm64 device artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-ios-arm64
          path: rn-ios-arm64

      - name: Download arm64 simulator artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-ios-sim-arm64
          path: rn-ios-sim-arm64

      - name: Download x86_64 simulator artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rn-ios-sim-x86_64
          path: rn-ios-sim-x86_64

      - name: Create fat simulator library
        run: |
          mkdir -p ios-sim
          lipo -create \
            rn-ios-sim-arm64/libzkap_uniffi_bindings.a \
            rn-ios-sim-x86_64/libzkap_uniffi_bindings.a \
            -output ios-sim/libzkap_uniffi_bindings.a

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library rn-ios-arm64/libzkap_uniffi_bindings.a \
            -headers packages/sdk-react-native/ios/include \
            -library ios-sim/libzkap_uniffi_bindings.a \
            -headers packages/sdk-react-native/ios/include \
            -output ZkapZkp.xcframework

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rn-ios-xcframework
          path: ZkapZkp.xcframework
          if-no-files-found: error
