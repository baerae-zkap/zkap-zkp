name: Build Node.js binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-latest
            zigbuild: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-zigbuild (musl only)
        if: matrix.zigbuild
        run: cargo binstall cargo-zigbuild --no-confirm --locked

      - name: Install musl target (musl only)
        if: matrix.zigbuild
        run: rustup target add x86_64-unknown-linux-musl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli

      - name: Build (standard)
        if: "!matrix.zigbuild"
        working-directory: packages/sdk-node
        run: napi build --platform --release --target ${{ matrix.target }}

      - name: Build (cargo-zigbuild musl)
        if: matrix.zigbuild
        working-directory: packages/sdk-node
        run: |
          cargo zigbuild --target x86_64-unknown-linux-musl --release --manifest-path ../../Cargo.toml -p zkap-zkp-node
          cp ../../target/x86_64-unknown-linux-musl/release/libzkap_zkp_node.so zkap-zkp-node.linux-x64-musl.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/sdk-node/*.node
          if-no-files-found: error
