name: Build Node.js binaries

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-latest
            zigbuild: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Setup Node.js
        if: "!matrix.zigbuild"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @napi-rs/cli
        if: "!matrix.zigbuild"
        run: npm install -g @napi-rs/cli

      - name: Build (standard)
        if: "!matrix.zigbuild"
        working-directory: packages/sdk-node
        run: napi build --platform --release --target ${{ matrix.target }}

      - name: Build (musl via napi-rs alpine Docker)
        if: matrix.zigbuild
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          options: -v ${{ github.workspace }}:/build -w /build
          run: |
            apk add --no-cache gcc g++ musl-dev linux-headers cmake
            rustup update stable
            unset CC_x86_64_unknown_linux_musl
            unset CXX_x86_64_unknown_linux_musl
            cargo build --release --target x86_64-unknown-linux-musl -p zkap-zkp-node
            cp target/x86_64-unknown-linux-musl/release/libzkap_zkp_node.so packages/sdk-node/zkap-zkp-node.linux-x64-musl.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/sdk-node/*.node
          if-no-files-found: error
