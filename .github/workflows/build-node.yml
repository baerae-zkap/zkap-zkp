name: Build Node.js binaries

# Tag pushes intentionally do NOT trigger this workflow: release.yml builds
# its own binaries and never consumes these artifacts, so a tag-time run here
# only burned runners. Path filters skip the matrix for changes that cannot
# affect the node binaries (docs, lockfile-only bumps, other packages).
on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'packages/sdk-node/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-node.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/sdk-node/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-node.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            zigbuild: false
            binary_name: index.darwin-x64.node
          - target: aarch64-apple-darwin
            os: macos-latest
            zigbuild: false
            binary_name: index.darwin-arm64.node
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild: false
            binary_name: index.linux-x64-gnu.node
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
            binary_name: index.linux-x64-musl.node
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            zigbuild: false
            binary_name: index.linux-arm64-gnu.node
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            zigbuild: true
            binary_name: index.linux-arm64-musl.node

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Caches ~/.cargo and ./target keyed per matrix target. The musl rows
      # build inside the napi-rs alpine container, which mounts the workspace,
      # so their ./target is host-visible and cached the same way.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@c3664f981c04ab538bd76b0ba83680ee5bab631a  # v1.17.9

      - name: Setup Node.js
        if: "!matrix.zigbuild"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @napi-rs/cli
        if: "!matrix.zigbuild"
        run: npm install -g @napi-rs/cli

      - name: Build (standard)
        if: "!matrix.zigbuild"
        working-directory: packages/sdk-node
        run: napi build --platform --release --target ${{ matrix.target }}

      - name: Normalize artifact filename
        if: "!matrix.zigbuild"
        working-directory: packages/sdk-node
        shell: bash
        run: |
          if [ -f "${{ matrix.binary_name }}" ]; then
            exit 0
          fi
          FOUND="$(find . -maxdepth 1 -name '*.node' | head -n 1)"
          if [ -z "$FOUND" ]; then
            echo "::error::No .node artifact was produced"
            exit 1
          fi
          mv "$FOUND" "${{ matrix.binary_name }}"

      - name: Build (musl via napi-rs alpine Docker)
        if: matrix.zigbuild
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185  # v3
        with:
          image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          options: -v ${{ github.workspace }}:/build -w /build
          run: |
            apk add --no-cache gcc g++ musl-dev linux-headers cmake
            rustup update stable
            unset CC_x86_64_unknown_linux_musl CXX_x86_64_unknown_linux_musl
            unset CC_aarch64_unknown_linux_musl CXX_aarch64_unknown_linux_musl
            cargo build --release --target ${{ matrix.target }} -p zkap-zkp-node
            cp target/${{ matrix.target }}/release/libzkap_zkp_node.so packages/sdk-node/${{ matrix.binary_name }}

      - name: Verify musl artifact
        if: matrix.zigbuild
        working-directory: packages/sdk-node
        shell: bash
        run: test -f "${{ matrix.binary_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/sdk-node/${{ matrix.binary_name }}
          if-no-files-found: error
