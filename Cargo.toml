[workspace]
resolver = "2"
members = [
    "packages/sdk-node",
    "packages/sdk-wasm",
    "crates/prover",
    "crates/uniffi-bindings",
]

[workspace.dependencies]
# Decoupling FINAL FORM: depend on the semver-stable zkap-service public
# boundary from the published release tag — no git `rev` pin, no local
# `[patch]`.
#
# Supply-chain: git tags are mutable, but the committed Cargo.lock pins the
# resolved commit (1985bc3b), so CI / published / `--locked` / normal
# `cargo build` are unaffected by an upstream re-tag. Only an explicit
# `cargo update -p zkap-service` re-resolves the tag — do NOT run it without
# auditing the new commit range, then bump this tag deliberately. (Cargo
# rejects `tag` + `rev` together, so we keep the readable `tag` + the
# lockfile commit-pin rather than a bare `rev`.)
zkap-service = { git = "https://github.com/snp-labs/zkap-circuit.git", tag = "v0.1.1-rc.3", default-features = false }
mimalloc = { version = "0.1.48", default-features = false }
napi = { version = "2.16", features = ["napi8"] }
napi-derive = { version = "2.16" }
rayon = "1"

[workspace.metadata.ark]
# parallel feature는 zkap-circuit workspace.dependencies에서 default-features=false로 비활성화됨

[profile.release]
lto = true
strip = "symbols"
# panic = "abort"  # temporarily disabled to get error messages via UniFFI

# Accepted cargo audit advisories (transitive deps from snp-labs/zkap-circuit, no fix available)
# Run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0055
#   RUSTSEC-2023-0071: rsa Marvin Attack (CVSS 5.9) — gadget -> zkap-service, operator-only
#   RUSTSEC-2025-0055: tracing-subscriber log poisoning — ark-relations, fix needs upstream update
[workspace.metadata.audit]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2025-0055"]
