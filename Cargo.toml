[workspace]
resolver = "2"
members = [
    "packages/sdk-node",
    "packages/sdk-wasm",
    "crates/prover",
    "crates/uniffi-bindings",
]

[workspace.dependencies]
# Pin zkap-service (and its in-repo sibling crates) to the public v0.1.1-rc.4
# release tag of snp-labs/zkap-circuit. rc.4 exposes `derive_selector` as a
# public service API and ships the k-of-n-agnostic loader.
#
# This pin only fixes the host-side surface the SDK compiles+calls natively:
# `derive_selector`, `get_poseidon_params`, `generate_poseidon_hash`, and the
# `prove_bundles`/`verify` Groth16 facade. The circuit, ar1cs, witness_gen.wasm,
# and CRS are release artifacts loaded at RUNTIME (not compiled in), so this pin
# is circuit-agnostic.
zkap-service = { git = "https://github.com/snp-labs/zkap-circuit.git", tag = "v0.1.1-rc.4", default-features = false }
mimalloc = { version = "0.1.48", default-features = false }
napi = { version = "2.16", features = ["napi8"] }
napi-derive = { version = "2.16" }
rayon = "1"

[workspace.metadata.ark]
# parallel feature는 zkap-circuit workspace.dependencies에서 default-features=false로 비활성화됨

[profile.release]
lto = true
strip = "symbols"
# panic = "abort"  # temporarily disabled to get error messages via UniFFI

# Accepted cargo audit advisories (transitive deps from snp-labs/zkap-circuit, no fix available)
# Run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0055
#   RUSTSEC-2023-0071: rsa Marvin Attack (CVSS 5.9) — gadget -> zkap-service, operator-only
#   RUSTSEC-2025-0055: tracing-subscriber log poisoning — ark-relations, fix needs upstream update
[workspace.metadata.audit]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2025-0055"]

