[workspace]
resolver = "2"
members = [
    "packages/sdk-node",
    "packages/sdk-wasm",
    "crates/prover",
    "crates/uniffi-bindings",
]

[workspace.dependencies]
# Declared as the existing git `rev` (d600a878, resolvable on the remote) so
# the build is robust; the `[patch]` below overrides it with the local P1
# checkout. The decoupling's FINAL FORM is a semver TAG dep — once
# zkap-circuit publishes the tag, replace this line with:
#   zkap-service = { git = "https://github.com/snp-labs/zkap-circuit.git", tag = "v0.1.1-rc.2", default-features = false }
# and delete the `[patch]` block below. (We keep `rev` rather than declaring
# the not-yet-published `tag` because cargo resolves the git ref and errors on
# a missing tag even when the dep is patched out.)
zkap-service = { git = "https://github.com/snp-labs/zkap-circuit.git", rev = "d600a8782f2ae5be89755b3de4dde80473741356", default-features = false }
mimalloc = { version = "0.1.48", default-features = false }
napi = { version = "2.16", features = ["napi8"] }
napi-derive = { version = "2.16" }
rayon = "1"

# Local path-patch for the zkap-circuit/zkap-zkp decoupling (P2).
#
# The P1 boundary in ../zkap-circuit (branch
# `feat/zkap-service-semver-boundary`: semver-stable public API +
# rayon-parallel `prove_bundles` / `verify`) is committed locally but NOT
# pushed, so the declared git `rev` above cannot resolve it yet. Point
# `zkap-service` at the local P1 checkout so the build picks up
# `prove_bundles` / `verify` / `PreflightMode`. Do NOT push this patch.
#
# FINAL STATE: drop this `[patch]` and bump the declared `zkap-service`
# dependency above to a release-tag semver version once zkap-circuit cuts
# a release containing the P1 boundary.
[patch."https://github.com/snp-labs/zkap-circuit.git"]
zkap-service = { path = "../zkap-circuit/crates/service" }

[workspace.metadata.ark]
# parallel feature는 zkap-circuit workspace.dependencies에서 default-features=false로 비활성화됨

[profile.release]
lto = true
strip = "symbols"
# panic = "abort"  # temporarily disabled to get error messages via UniFFI

# Accepted cargo audit advisories (transitive deps from snp-labs/zkap-circuit, no fix available)
# Run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0055
#   RUSTSEC-2023-0071: rsa Marvin Attack (CVSS 5.9) — gadget -> zkap-service, operator-only
#   RUSTSEC-2025-0055: tracing-subscriber log poisoning — ark-relations, fix needs upstream update
[workspace.metadata.audit]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2025-0055"]
