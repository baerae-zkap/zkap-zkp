[package]
name = "zkap-uniffi-bindings"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# `native-prove` is required for the `zkap_service::prove_bundles` façade
# entry point. It pulls in artifact-loader + native-witness, so the
# separate `host-primitives` / `manifest` / `artifact-loader` flags are
# subsumed. `setup` (trusted-setup / key generation) is intentionally NOT
# enabled: the SDK loads pre-generated release bundles and never runs setup,
# and zkap-service now gates `groth16::setup` behind the `setup` feature so
# `native-prove` alone compiles.
zkap-service = { workspace = true, features = ["native-prove"] }
uniffi = { version = "0.31", features = ["cli"] }
thiserror = "1"
mimalloc = { workspace = true }
base64 = "0.22"
sha2 = "0.10"

# Phase 4 — wasm-runtime + circuit-agnostic prove deps.
#
# Mobile witness generation uses the release `witness_gen.wasm` artifact
# loaded from the manifest (see [[zkap-circuit]] crates/witness-gen-wasm).
# Non-iOS targets use wasmtime's Cranelift-backed runtime for throughput.
# iOS production witness synthesis is handled by the React Native package's
# WKWebView runner, then proof generation resumes here through
# `prove_from_witness_bundles`. Wasmi is kept behind a diagnostic feature only.
# Native Groth16 proving is now routed through
# `zkap_service::prove_bundles` (rayon-parallel inside the façade); this
# crate no longer depends on `ark-ar1cs` or constructs its own RNG/prove loop.
# `ark-serialize` remains only to deserialize the wasm witness bundles.
zkap-zkp-prover = { path = "../prover" }
ark-serialize = "0.6"
serde_json = "1"

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
wasmi = { version = "0.38", default-features = false, features = ["std"], optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]
wasmtime = { version = "26.0", default-features = false, features = ["cranelift", "runtime"], optional = true }

[features]
default = ["wasm-witness"]
wasm-witness = ["dep:wasmtime"]
wasmi-diagnostic = ["dep:wasmi"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
