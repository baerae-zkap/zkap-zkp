[package]
name = "zkap-uniffi-bindings"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
zkap-service = { workspace = true, features = ["proof"] }
uniffi = { version = "0.31", features = ["cli"] }
thiserror = "1"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
